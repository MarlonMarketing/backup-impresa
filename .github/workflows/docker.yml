name: Test and publish Docker
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build
        run: docker build -t backup-impresa-ci .
      - name: Integration and safety tests
        run: docker run --rm --network none --memory 512m --cpus 1 --entrypoint node backup-impresa-ci --test test/core.test.mjs test/server.test.mjs test/i18n.test.mjs
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Publish versioned image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag backup-impresa-ci "$image:$version"
          docker push "$image:$version"
          docker logout ghcr.io
    permissions:
      contents: read
      packages: write
